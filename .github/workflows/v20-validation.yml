name: V20 browser validation
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --package-lock=false playwright@1.51.1
      - run: npx playwright install --with-deps chromium webkit
      - run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/v20-http.log 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8765/index.html >/dev/null && break; sleep 1; done
          node tests/v20-smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v20-browser-evidence
          path: test-results/
          if-no-files-found: warn
