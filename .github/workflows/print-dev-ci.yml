name: VYRTUA Print DEV CI
on:
  push:
    branches: [development/vyrtua-print-saas]
    paths:
      - 'print-core/**'
      - 'print-dev.html'
      - 'creative-lab.html'
      - 'assets/css/print-dev.css'
      - 'supabase/migrations/**'
      - 'tests/**'
      - '.github/workflows/print-dev-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: print-dev-ci
  cancel-in-progress: true
jobs:
  validation:
    if: github.ref == 'refs/heads/development/vyrtua-print-saas'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check print-core/api.mjs
          node --check print-core/panel.mjs
          node --check tests/print-mobile.cjs
          node --check print-core/api-smoke.mjs
      - name: Unit tests
        run: node --test print-core/order.test.mjs tests/smoke.cjs
      - name: Mobile WebKit interface with simulated API
        env:
          PRINT_BROWSER: webkit
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps webkit
          node tests/print-mobile.cjs
      - name: Development HTTP smoke tests
        if: ${{ !cancelled() }}
        env:
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.PRINT_DEV_PUBLISHABLE_KEY }}
          TEST_A_EMAIL: ${{ secrets.PRINT_DEV_TEST_A_EMAIL }}
          TEST_A_PASSWORD: ${{ secrets.PRINT_DEV_TEST_A_PASSWORD }}
          TEST_B_EMAIL: ${{ secrets.PRINT_DEV_TEST_B_EMAIL }}
          TEST_B_PASSWORD: ${{ secrets.PRINT_DEV_TEST_B_PASSWORD }}
        run: |
          if [ -z "$SUPABASE_PUBLISHABLE_KEY" ] || [ -z "$TEST_A_EMAIL" ] || [ -z "$TEST_A_PASSWORD" ] || [ -z "$TEST_B_EMAIL" ] || [ -z "$TEST_B_PASSWORD" ]; then
            echo "::warning::HTTP tests NOT RUN: missing test credentials"
            exit 1
          fi
          node print-core/api-smoke.mjs
